[project]
name = "insurance-virtual-agent-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: PEP 8 errors and warnings
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "B",       # flake8-bugbear: likely bugs
    "UP",      # pyupgrade: use modern Python 3.12 syntax
    "SIM",     # flake8-simplify: simpler equivalent code
    "RUF",     # ruff's own rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]